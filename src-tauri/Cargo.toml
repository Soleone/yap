[package]
name = "yap"
version = "0.1.0"
description = "Text to speech that starts at once and keeps what it read"
authors = ["Soleone"]
edition = "2024"
rust-version = "1.90"
default-run = "yap-app"

[lib]
name = "yap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yap-app"
path = "src/main.rs"

[[bin]]
name = "yap"
path = "src/bin/yap.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
cpal = "0.16"
dirs = "6"
hound = "3.5"
ptts = { version = "0.7.1", features = ["hf", "hub"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.dev.package.ptts]
opt-level = 3
[profile.dev.package.xn]
opt-level = 3
