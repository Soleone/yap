[package]
name = "yap"
version = "0.1.0"
description = "Text to speech that starts at once and keeps what it read"
authors = ["Soleone"]
edition = "2024"
rust-version = "1.90"
default-run = "yap-app"

[lib]
name = "yap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yap-app"
path = "src/main.rs"

[[bin]]
name = "yap"
path = "src/bin/yap.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
arboard = "3.7.0"
cpal = "0.16"
dirs = "6"
hound = "3.5"
ptts = { version = "0.7.1", features = ["hf", "hub"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
whatlang = "0.18.0"

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.3"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = { version = "0.3.2", features = [
  "NSWorkspace",
  "NSRunningApplication",
  "NSPasteboard",
] }
objc2-core-graphics = { version = "0.3.2", features = ["CGEvent", "CGEventTypes", "CGEventSource"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

[profile.dev.package.ptts]
opt-level = 3
[profile.dev.package.xn]
opt-level = 3
